<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Source Job Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body onload="checkAuthStatus()">

    <nav class="navbar">
        <div class="logo">JobPortal</div>
        <div class="menu" id="nav-menu">
            <!-- Dynamically populated by JS based on Auth -->
            <a href="jobs.html">Find Jobs</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="btn-secondary" style="padding: 0.5rem 1rem; border-radius: 8px;">Register</a>
        </div>
    </nav>

    <div class="container main-content" style="margin-top: 4rem;">
        <h1 style="font-size: 3rem; color: var(--primary); margin-bottom: 1rem;">Find Your Dream Job</h1>
        <p style="font-size: 1.25rem; color: var(--text-muted); margin-bottom: 2rem;">Connecting talented professionals with amazing open source opportunities.</p>
        
        <div>
            <a href="jobs.html"><button style="font-size: 1.1rem; padding: 1rem 2rem;">Browse Jobs</button></a>
            <a href="register.html"><button class="btn-secondary" style="font-size: 1.1rem; padding: 1rem 2rem; margin-left:1rem;">Upload Resume</button></a>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
