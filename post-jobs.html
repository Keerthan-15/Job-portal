<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | Job Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body onload="checkAuthStatus()">

    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none;">JobPortal</a>
        <div class="menu" id="nav-menu"></div>
    </nav>

    <div class="container">
        <div class="form-container" style="max-width: 600px;">
            <h2>Post a New Job</h2>
            <form onsubmit="postJob(event)">
                <input type="text" id="title" placeholder="Job Title" required>
                
                <div style="display: flex; gap: 1rem;">
                    <input type="text" id="location" placeholder="Location (e.g., Remote, NY)" style="flex:1;" required>
                    <input type="text" id="salary" placeholder="Salary/Compensation" style="flex:1;">
                </div>
                
                <select id="type" required>
                    <option value="" disabled selected>Job Type</option>
                    <option value="Full Time">Full Time</option>
                    <option value="Part Time">Part Time</option>
                    <option value="Internship">Internship</option>
                    <option value="Contract">Contract</option>
                </select>

                <textarea id="description" placeholder="Job Description" rows="4" style="width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:8px; font-family:inherit;" required></textarea>
                
                <textarea id="requirements" placeholder="Requirements & Qualifications" rows="3" style="width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:8px; font-family:inherit;" required></textarea>
                
                <input type="date" id="deadline" required>

                <button type="submit" style="margin-top: 1rem;">Publish Job</button>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
