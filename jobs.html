<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs | Job Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body onload="displayJobs()">

    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none;">JobPortal</a>
        <div class="menu" id="nav-menu"></div>
    </nav>

    <div class="container main-content">
        <h2 style="margin-bottom: 2rem; color: var(--primary);">Available Jobs</h2>
        
        <div class="filters-bar">
            <input type="text" id="search" placeholder="Search by title, location..." onkeyup="searchJobs()">
            <select id="typeFilter" onchange="searchJobs()">
                <option value="">All Types</option>
                <option value="Full Time">Full Time</option>
                <option value="Part Time">Part Time</option>
                <option value="Internship">Internship</option>
            </select>
        </div>

        <div id="jobList" class="jobs-grid">
            <!-- Jobs will be populated here by JS -->
            <p>Loading jobs...</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
