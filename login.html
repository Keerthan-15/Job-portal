<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Job Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body onload="checkAuthStatus()">

    <nav class="navbar">
        <a href="index.html" class="logo" style="text-decoration: none;">JobPortal</a>
        <div class="menu" id="nav-menu"></div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>Welcome Back</h2>
            <form onsubmit="login(event)">
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem; color: var(--text-muted);">
                Don't have an account? <a href="register.html" style="color: var(--primary);">Register here</a>
            </p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
